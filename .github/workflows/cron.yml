name: 비서 크론

# Vercel Hobby 크론은 하루 1회 제한이라 알림 엔진을 돌릴 수 없다.
# Actions 는 무료로 10분 간격이 되므로 여기서 깨운다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: assistant-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: 알림 규칙 평가
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL 또는 CRON_SECRET 시크릿이 설정되지 않았습니다." >&2
            exit 1
          fi

          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            --max-time 60 --retry 2 --retry-delay 5 \
            -X POST "$SITE_URL/api/cron/tick" \
            -H "x-cron-secret: $CRON_SECRET")

          echo "HTTP $code"
          cat /tmp/out.json
          echo

          # 404 는 시크릿 불일치다. 조용히 넘어가면 알림이 안 오는데
          # 이유를 영영 모르게 된다.
          if [ "$code" != "200" ]; then
            echo "크론 호출 실패 (HTTP $code)" >&2
            exit 1
          fi
